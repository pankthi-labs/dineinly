<svg
  width="22.08"
  height="58"
  viewBox="0 15 22.08 58"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="presentation"
  aria-hidden="true"
>
  <!--
    DINEINLY — Logomark only, split from dineinly-logo-dark-v2.svg (the
    master lockup, still used unaltered by BrandLogo/PoweredByDineinly) so
    the mark can animate independently of the wordmark. Same circle, same
    clip, same fill token as the master — edit both files together if the
    mark geometry ever changes.
  -->
  <defs>
    <clipPath id="dineinly-mark-clip">
      <rect x="0" y="15" width="22.08" height="46.16"/>
    </clipPath>
  </defs>
  <circle
    cx="22.08"
    cy="38.08"
    r="22.08"
    fill="#D6B36A"
    clip-path="url(#dineinly-mark-clip)"
  />
</svg>
