  <!--
    DINEINLY — Primary lockup · Dark background · v3.0 FINAL LOCKED

    Mark   Gold form   fill: #D6B36A (token: color accent primary / Champagne Gold)
    Word   White form  fill: #E7EAEE (token: color text primary / Alabaster White)
    Stage  Base        fill: #0B1018 (token: color bg base / Midnight Obsidian)

    Wordmark weight changed from Medium (500) to Regular (400) — Medium read
    too heavy for the intended premium/luxury tone; Regular keeps the mark
    as the visual anchor and reads lighter without sacrificing legibility
    at the 20px minimum size.

    Geometry (fontSize = 64):
      radius 22.08   cy 38.08   capTop 16.00
      gap 5.00   textX 27.08   baselineY 60.16
      letter spacing -0.5

    The wordmark is baked as vector path outlines extracted directly from
    Outfit, weight 400 — not a live text element. This removes any
    dependency on the viewing context having Outfit loaded, which
    otherwise causes fallback to a thinner system sans-serif when the SVG
    is viewed standalone (e.g. via an img tag, which blocks external font
    and stylesheet fetches for security).
  -->
  <defs>
    <clipPath id="dineinly-mark-clip">
      <rect x="0" y="15" width="22.08" height="46.16"/>
    </clipPath>
  </defs>

  <!-- MARK, Gold form -->
