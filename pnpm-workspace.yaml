packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  sharp: true
  esbuild: true
  # Git hooks are registered via the root package.json `prepare` script
  # instead (explicit, auditable) — simple-git-hooks's own postinstall
  # build is not needed.
  simple-git-hooks: false

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@supabase/*"
  - "@biomejs/*"
  - "supabase"
