<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />

<title>Your Dineinly sign-in code</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f1ea;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f1ea;padding:40px 16px;">
<tr>
<td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:420px;background-color:#ffffff;border:1px solid #e6e0d2;border-radius:12px;">
<tr>
<td align="center" style="padding:36px 32px 28px;">
<span style="font-size:18px;font-weight:600;letter-spacing:0.14em;color:#1a1a1a;text-transform:uppercase;">Dineinly</span>
</td>
</tr>
<tr>
<td style="padding:0 32px;text-align:center;">

</td>
</tr>
<tr>
<td align="center" style="padding:28px 32px;">
<table role="presentation" cellpadding="0" cellspacing="0" style="background-color:#faf3e5;border:1px solid #ecd9ac;border-radius:8px;">
<tr>
<td style="padding:14px 28px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:30px;font-weight:700;letter-spacing:0.32em;color:#1a1a1a;">{{ .Token }}</td>
</tr>
</table>
</td>
</tr>
<tr>
<td style="padding:0 32px 32px;text-align:center;">
<p style="margin:0;font-size:12px;line-height:1.5;color:#9a978a;">If you didn't request this, you can safely ignore this email.</p>
</td>
</tr>
</table>
<p style="margin:20px 0 0;font-size:12px;color:#a8a599;">&copy; Dineinly</p>
</td>
</tr>
</table>
</body>
</html>
